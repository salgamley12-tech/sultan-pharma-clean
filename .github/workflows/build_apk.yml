name: Build Sultan Pharma APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Auto-Detect Project Directory and Build
        run: |
          # البحث عن مكان pubspec.yaml والتحول إليه تلقائياً
          PROJECT_DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \;)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # تثبيت الحزم والبناء
          flutter pub get
          flutter build apk --release --no-v1-app-bundle
          
          # نقل الناتج إلى الجذر ليتم رفعه بسهولة
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/sultan-pharma.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sultan-pharma-release
          path: output/sultan-pharma.apk
          
